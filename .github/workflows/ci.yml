name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  omniloader:
    name: Omniloader (MinGW, tests under Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64 and Wine
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 wine64

      - name: Build and test under Wine
        timeout-minutes: 10
        env:
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: native/omniloader/build.sh test

      # For the app builds below, which carry the DLL inside the app.
      - name: Upload DLL
        uses: actions/upload-artifact@v6
        with:
          name: omniloader-dll
          path: native/omniloader/out/omniloader.dll
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.rid }})
    needs: omniloader
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x64 is the primary target for this project; listed first so it
          # is the leading status. Building on Linux exercises the cross-platform
          # Avalonia code paths and the OS-conditional OutputType (Exe).
          - os: ubuntu-latest
            rid: linux-x64
          # win-x64 is the secondary target. Building on a Windows runner keeps
          # the csproj's OS-conditional OutputType (WinExe) correct.
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v6

      # Without it the app still builds, and silently drops the omniloader option.
      - name: Fetch the omniloader
        uses: actions/download-artifact@v7
        with:
          name: omniloader-dll
          path: native/omniloader/out

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          # Pinned to the major version targeted by the projects (net10.0).
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/UpscalerManager.App/UpscalerManager.App.csproj -r ${{ matrix.rid }}

      - name: Build app
        run: >
          dotnet build src/UpscalerManager.App/UpscalerManager.App.csproj
          -c Release -r ${{ matrix.rid }} --no-restore

      # Unit tests guard the risky pure logic ported into Core (PE inspection,
      # section-aware ini editing, custom-FSR4 version gate, FSR SDK-package scan)
      # plus the component registry (mutual exclusion + preview).
      - name: Test
        run: dotnet test tests/UpscalerManager.Core.Tests/UpscalerManager.Core.Tests.csproj -c Release

      # Every push to main leaves an app to try, kept for two weeks. Only a [release]
      # commit or a tag publishes one; these are for testing.
      - name: Publish
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish src/UpscalerManager.App/UpscalerManager.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      # Artifacts drop the executable bit, so on Linux the app goes up inside its own zip,
      # as releases do.
      - name: Zip (Linux)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        run: cd publish && zip -qr ../UpscalerManager-main-${{ matrix.rid }}.zip .

      - name: Upload app (Linux)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: UpscalerManager-main-${{ matrix.rid }}-${{ github.sha }}
          path: UpscalerManager-main-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload app (Windows)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: UpscalerManager-main-${{ matrix.rid }}-${{ github.sha }}
          path: publish/
          if-no-files-found: error
          retention-days: 14
