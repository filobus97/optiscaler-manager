name: Omniloader

# Builds the experimental omniloader, uploads the test kit testers unpack beside
# OptiScaler, then runs its tests under Wine. Only the omniloader branch builds it; main
# does not ship it yet.
on:
  push:
    branches: [omniloader]
    paths:
      - "native/omniloader/**"
      - ".github/workflows/omniloader.yml"
  workflow_dispatch:

concurrency:
  group: omniloader-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 zip

      # The kit is uploaded before Wine is installed, so a slow Wine install or a failing
      # test still leaves a DLL to try. A failed test fails the run all the same.
      - name: Build test kit
        run: native/omniloader/build.sh kit

      - name: Upload test kit
        uses: actions/upload-artifact@v6
        with:
          name: omniloader-test-kit-${{ github.sha }}
          path: native/omniloader/out/kit/
          if-no-files-found: error

      - name: Install Wine
        timeout-minutes: 15
        run: sudo apt-get install -y --no-install-recommends wine64

      # Wine would otherwise offer to install Mono and Gecko on first start.
      - name: Test under Wine
        timeout-minutes: 10
        env:
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: native/omniloader/build.sh test
