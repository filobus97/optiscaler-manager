name: Release

on:
  push:
    tags:
      - "v*"
    # Merge-based fallback: a push to main whose commit message contains
    # "[release]" also cuts a release (version read from the csproj, tag created
    # by the release job). Useful when tags can't be pushed directly. Pushes to
    # main WITHOUT the marker skip all jobs via the job-level "if".
    branches:
      - main
      # Testing builds: a push to a feature branch whose commit message contains
      # "[testing]" publishes a pre-release tagged v<csproj version>-test.<run>. GitHub
      # leaves pre-releases out of releases/latest, which is all the in-app updater
      # reads, so nobody is offered one who did not go looking for it.
      - "claude/**"
      - "feature/**"
  # Manual fallback: release without pushing a tag (the release step below
  # creates the tag).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  # The omniloader is a Windows DLL the app carries inside it, built with MinGW-w64 and
  # tested under Wine. Every platform's app gets the same one, so it is built once.
  omniloader:
    name: Omniloader DLL
    # A [release] commit releases only from main: the same commit pushed to a feature
    # branch afterwards must not release twice.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) ||
      (github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/') &&
       contains(github.event.head_commit.message, '[testing]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64 and Wine
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 wine64 zip

      # A release whose loader fails its own tests is not shipped.
      - name: Build and test under Wine
        timeout-minutes: 10
        env:
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: native/omniloader/build.sh test

      - name: Upload DLL
        uses: actions/upload-artifact@v6
        with:
          name: omniloader-dll
          path: native/omniloader/out/omniloader.dll
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (${{ matrix.rid }})
    needs: omniloader
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x64 (primary) first, then win-x64, then macOS.
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - uses: actions/checkout@v6

      # Without it the app still builds, and silently drops the "several FSR builds" option.
      - name: Fetch the omniloader
        uses: actions/download-artifact@v7
        with:
          name: omniloader-dll
          path: native/omniloader/out

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # [release]-marked push to main: the csproj is the source of truth. A
            # testing build is the version it is on its way to, numbered by run.
            v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/UpscalerManager.App/UpscalerManager.App.csproj | head -1)
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then v="$v-test.${{ github.run_number }}"; fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      # Tests gate the release. They used to run only in CI, on a separate workflow
      # that could go red without stopping a publish — and did, for five releases,
      # because the failures were Windows-only and nobody was reading that status.
      # A release that cannot pass its own tests should not be uploaded.
      - name: Test
        run: dotnet test tests/UpscalerManager.Core.Tests/UpscalerManager.Core.Tests.csproj -c Release

      # Untrimmed self-contained single-file publish. PublishTrimmed stays off
      # (Avalonia + reflection paths are not verified trim-safe).
      - name: Publish
        run: >
          dotnet publish src/UpscalerManager.App/UpscalerManager.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "UpscalerManager-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"

      # zip (not Compress-Archive) on Unix so the executable bit survives.
      - name: Create zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd publish
          zip -r "../UpscalerManager-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: UpscalerManager-${{ matrix.rid }}
          path: UpscalerManager-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/UpscalerManager.App/UpscalerManager.App.csproj | head -1)
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then v="$v-test.${{ github.run_number }}"; fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "testing=true" >> "$GITHUB_OUTPUT"
          else
            echo "testing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # On workflow_dispatch the tag does not exist yet; tag_name +
      # target_commitish make action-gh-release create it at the built commit.
      - name: Create release and attach zips
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: ${{ steps.version.outputs.testing != 'true' }}
          draft: false
          prerelease: ${{ steps.version.outputs.testing == 'true' }}
          make_latest: ${{ steps.version.outputs.testing != 'true' }}
          name: >-
            ${{ steps.version.outputs.testing == 'true' && format('v{0} (testing)', steps.version.outputs.version) || '' }}
          body: >-
            ${{ steps.version.outputs.testing == 'true' && format('Testing build from `{0}` at {1}. Not a release: the in-app updater does not offer it.', github.ref_name, github.sha) || '' }}
